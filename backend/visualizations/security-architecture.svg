<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 720" width="100%" height="100%">
  <defs>
    <!-- Gradients -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b0f19" />
      <stop offset="100%" stop-color="#111827" />
    </linearGradient>

    <linearGradient id="hostGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>

    <linearGradient id="vmGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#064e3b" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#022c22" stop-opacity="0.4" />
    </linearGradient>

    <linearGradient id="agentUserGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#312e81" stop-opacity="0.5" />
      <stop offset="100%" stop-color="#1e1b4b" stop-opacity="0.8" />
    </linearGradient>

    <linearGradient id="devUserGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#374151" stop-opacity="0.5" />
      <stop offset="100%" stop-color="#1f2937" stop-opacity="0.8" />
    </linearGradient>

    <linearGradient id="firewallGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ef4444" />
      <stop offset="50%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#ef4444" />
    </linearGradient>

    <!-- Filters -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <style>
    .title { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; font-weight: 800; fill: #f8fafc; }
    .subtitle { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; font-size: 14px; fill: #94a3b8; }
    .box-title { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; font-weight: 700; font-size: 16px; }
    .label { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; font-size: 13px; fill: #cbd5e1; }
    .code { font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace; font-size: 12px; }
    .badge { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; font-size: 11px; font-weight: 700; text-anchor: middle; }
    .card { rx: 12px; stroke-width: 1.5; }
  </style>

  <!-- Canvas Background -->
  <rect width="100%" height="100%" fill="url(#bgGrad)" />

  <!-- Header -->
  <g transform="translate(60, 45)">
    <text class="title" font-size="24">Sandbox-Native CLI Architecture &amp; Dual-User Isolation</text>
    <text class="subtitle" y="24">Zero backend host execution • Hardware MicroVM boundary • Linux DAC credential wall</text>
  </g>

  <!-- 1. BACKEND HOST (TRUSTED ZONE) -->
  <g transform="translate(60, 100)">
    <rect width="320" height="560" class="card" fill="url(#hostGrad)" stroke="#38bdf8" stroke-opacity="0.4" />
    
    <!-- Header -->
    <rect width="320" height="48" rx="12" fill="#0284c7" fill-opacity="0.15" />
    <circle cx="28" cy="24" r="6" fill="#38bdf8" filter="url(#glow)" />
    <text class="box-title" x="46" y="29" fill="#38bdf8">Backend Host (Trusted)</text>
    
    <!-- Specs Badge -->
    <rect x="20" y="65" width="280" height="32" rx="6" fill="#0f172a" stroke="#334155" />
    <text class="code" x="32" y="85" fill="#94a3b8">Fastify API • JWT Auth • Port 4000</text>

    <!-- Role Description -->
    <g transform="translate(20, 115)">
      <rect width="280" height="95" rx="8" fill="#1e293b" fill-opacity="0.6" stroke="#475569" stroke-opacity="0.3" />
      <text class="box-title" x="16" y="26" font-size="14" fill="#f1f5f9">Role: Pure Orchestrator</text>
      <text class="label" x="16" y="48">• Evaluates JWT auth &amp; session states</text>
      <text class="label" x="16" y="68">• Dispatches prompts to Sandbox VM</text>
      <text class="label" x="16" y="88">• Never executes user code or tools!</text>
    </g>

    <!-- Host Security Guarantee -->
    <g transform="translate(20, 230)">
      <rect width="280" height="150" rx="8" fill="#022c22" fill-opacity="0.3" stroke="#10b981" stroke-opacity="0.4" />
      <text class="box-title" x="16" y="26" font-size="13" fill="#34d399">🛡️ Host Immunity Guarantee</text>
      <text class="label" x="16" y="50">• Zero child processes for npm/bash</text>
      <text class="label" x="16" y="70">• Malicious scripts cannot touch host</text>
      <text class="label" x="16" y="90">• Host disk &amp; databases 100% insulated</text>
      <text class="label" x="16" y="110">• Survives infinite loops &amp; fork bombs</text>
      <text class="label" x="16" y="130">• Host CPU &amp; RAM strictly protected</text>
    </g>

    <!-- Communication Bridge -->
    <g transform="translate(20, 400)">
      <rect width="280" height="135" rx="8" fill="#1e1b4b" fill-opacity="0.4" stroke="#6366f1" stroke-opacity="0.4" />
      <text class="box-title" x="16" y="26" font-size="13" fill="#818cf8">E2B Sandbox Orchestration</text>
      <text class="code" x="16" y="50" fill="#a5b4fc">sandbox.commands.run(cliCmd)</text>
      <text class="label" x="16" y="75">• Real-time token streaming</text>
      <text class="label" x="16" y="95">• Auto-pause on idle (15 min)</text>
      <text class="label" x="16" y="115">• Reconnects across multi-sessions</text>
    </g>
  </g>

  <!-- INTER-ZONE CONNECTION ARROWS -->
  <g transform="translate(380, 240)">
    <!-- RPC Arrow Forward -->
    <path d="M 10 70 L 60 70" stroke="#38bdf8" stroke-width="3" stroke-dasharray="6,4" marker-end="url(#arrow)" />
    <rect x="15" y="45" width="40" height="18" rx="4" fill="#0284c7" />
    <text class="badge" x="35" y="58" fill="#ffffff">RPC</text>

    <!-- Stream Return Arrow -->
    <path d="M 60 150 L 10 150" stroke="#34d399" stroke-width="3" stroke-dasharray="6,4" />
    <rect x="10" y="160" width="50" height="18" rx="4" fill="#059669" />
    <text class="badge" x="35" y="173" fill="#ffffff">STREAM</text>
  </g>

  <!-- 2. E2B CLOUD FIRECRACKER MICROVM (ISOLATED ZONE) -->
  <g transform="translate(450, 100)">
    <!-- Outer MicroVM Box -->
    <rect width="690" height="560" class="card" fill="url(#vmGrad)" stroke="#10b981" stroke-opacity="0.5" stroke-dasharray="10,5" />
    
    <!-- MicroVM Header -->
    <rect width="690" height="48" rx="12" fill="#065f46" fill-opacity="0.3" />
    <circle cx="28" cy="24" r="6" fill="#10b981" filter="url(#glow)" />
    <text class="box-title" x="46" y="29" fill="#34d399">E2B Firecracker MicroVM (Kernel &amp; Network Isolated)</text>
    <rect x="530" y="12" width="140" height="24" rx="4" fill="#047857" />
    <text class="badge" x="600" y="28" fill="#ffffff">KVM Hypervisor</text>

    <!-- USER 1: AGENT-RUNNER (PROTECTED SYSTEM USER) -->
    <g transform="translate(25, 70)">
      <rect width="305" height="460" class="card" fill="url(#agentUserGrad)" stroke="#6366f1" stroke-opacity="0.6" />
      
      <!-- User 1 Header -->
      <rect width="305" height="42" rx="12" fill="#4338ca" fill-opacity="0.4" />
      <text class="box-title" x="16" y="26" font-size="14" fill="#a5b4fc">USER: agent-runner (UID 1001)</text>
      
      <!-- Permissions Badge -->
      <rect x="16" y="55" width="273" height="28" rx="6" fill="#1e1b4b" stroke="#4f46e5" stroke-opacity="0.5" />
      <text class="code" x="24" y="73" fill="#c7d2fe">chmod 700 /home/agent-runner</text>

      <!-- Executed CLIs -->
      <g transform="translate(16, 95)">
        <rect width="273" height="110" rx="6" fill="#1e1b4b" fill-opacity="0.6" stroke="#4338ca" stroke-opacity="0.3" />
        <text class="box-title" x="12" y="22" font-size="13" fill="#818cf8">Runs Pre-Installed Agent CLIs</text>
        <text class="code" x="12" y="44" fill="#e2e8f0">• agy (Antigravity CLI)</text>
        <text class="code" x="12" y="64" fill="#e2e8f0">• claude (Claude Code CLI)</text>
        <text class="code" x="12" y="84" fill="#e2e8f0">• codex (Codex CLI)</text>
        <text class="label" x="12" y="102" font-size="11" fill="#94a3b8">Executes with HOME=/home/agent-runner</text>
      </g>

      <!-- Vault / Protected Credentials -->
      <g transform="translate(16, 220)">
        <rect width="273" height="140" rx="6" fill="#0f172a" stroke="#eab308" stroke-opacity="0.5" />
        <text class="box-title" x="12" y="22" font-size="13" fill="#fde047">🔒 Vault: chmod 600 Secrets</text>
        <text class="code" x="12" y="45" fill="#fef08a">~/.gemini/oauth_creds.json</text>
        <text class="code" x="12" y="65" fill="#fef08a">~/.claude/.credentials.json</text>
        <text class="code" x="12" y="85" fill="#fef08a">~/.codex/auth.json</text>
        <text class="code" x="12" y="105" fill="#fef08a">API_KEY environment tokens</text>
        <text class="label" x="12" y="128" font-size="11" fill="#facc15">Owned by agent-runner:agent-runner</text>
      </g>

      <!-- Privilege Drop Arrow Note -->
      <g transform="translate(16, 375)">
        <rect width="273" height="70" rx="6" fill="#1e293b" stroke="#334155" />
        <text class="box-title" x="12" y="22" font-size="12" fill="#cbd5e1">Tool Execution Privilege Drop</text>
        <text class="code" x="12" y="42" fill="#38bdf8">su - user -c "npm test"</text>
        <text class="label" x="12" y="58" font-size="11" fill="#94a3b8">Drops root/agent rights to run tools</text>
      </g>
    </g>

    <!-- THE LINUX DAC KERNEL WALL -->
    <g transform="translate(340, 100)">
      <line x1="0" y1="0" x2="0" y2="400" stroke="url(#firewallGrad)" stroke-width="4" stroke-dasharray="8,4" />
      <rect x="-42" y="180" width="84" height="40" rx="8" fill="#b91c1c" stroke="#fca5a5" />
      <text class="badge" x="0" y="198" fill="#ffffff" font-size="10">LINUX DAC</text>
      <text class="badge" x="0" y="212" fill="#ffffff" font-size="9">WALL (0700)</text>
    </g>

    <!-- USER 2: DEVELOPER / UNTRUSTED WORKSPACE USER -->
    <g transform="translate(355, 70)">
      <rect width="310" height="460" class="card" fill="url(#devUserGrad)" stroke="#f59e0b" stroke-opacity="0.6" />
      
      <!-- User 2 Header -->
      <rect width="310" height="42" rx="12" fill="#b45309" fill-opacity="0.3" />
      <text class="box-title" x="16" y="26" font-size="14" fill="#fde68a">USER: user / developer (UID 1000)</text>

      <!-- Sudo Disabled Badge -->
      <rect x="16" y="55" width="278" height="28" rx="6" fill="#451a03" stroke="#f59e0b" stroke-opacity="0.5" />
      <text class="code" x="24" y="73" fill="#fef3c7">Sudo Rights: DISABLED (No root)</text>

      <!-- Workspace Directory -->
      <g transform="translate(16, 95)">
        <rect width="278" height="150" rx="6" fill="#111827" stroke="#334155" />
        <text class="box-title" x="12" y="22" font-size="13" fill="#38bdf8">📂 Workspace (/home/user/workspace)</text>
        <text class="label" x="12" y="44">• Project Source Code &amp; Repos</text>
        <text class="label" x="12" y="64">• node_modules &amp; Python virtualenvs</text>
        <text class="label" x="12" y="84">• Shell command executions (bash tool)</text>
        <text class="label" x="12" y="104">• Unit test runners &amp; compilers</text>
        <text class="label" x="12" y="124">• Inspected via Web UI Cloud Inspector</text>
        <text class="code" x="12" y="142" fill="#94a3b8">chmod 775 /home/user/workspace</text>
      </g>

      <!-- Blocked Attack Demonstration -->
      <g transform="translate(16, 260)">
        <rect width="278" height="185" rx="6" fill="#450a0a" fill-opacity="0.6" stroke="#ef4444" stroke-opacity="0.6" />
        <text class="box-title" x="12" y="22" font-size="13" fill="#fca5a5">🚫 Exfiltration Attack Blocked</text>
        <text class="label" x="12" y="42">What if malicious code/prompt attempts:</text>
        <text class="code" x="12" y="64" fill="#f87171">$ cat /home/agent-runner/.gemini/*</text>
        <rect x="12" y="75" width="254" height="28" rx="4" fill="#7f1d1d" />
        <text class="code" x="20" y="93" fill="#fee2e2">⛔ bash: Permission denied</text>
        
        <text class="label" x="12" y="122">What if malicious script runs:</text>
        <text class="code" x="12" y="142" fill="#f87171">$ sudo cat /home/agent-runner/...</text>
        <rect x="12" y="152" width="254" height="28" rx="4" fill="#7f1d1d" />
        <text class="code" x="20" y="170" fill="#fee2e2">⛔ user is not in sudoers file</text>
      </g>
    </g>
  </g>
</svg>
