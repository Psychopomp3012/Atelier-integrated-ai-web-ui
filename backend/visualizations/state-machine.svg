<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 950 560" width="100%" height="100%" style="background:#0b0f19; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;">
  <defs>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="6" stdDeviation="5" flood-color="#000" flood-opacity="0.5" />
    </filter>

    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#64748b" />
    </marker>
    <marker id="arrowBlue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#3b82f6" />
    </marker>
    <marker id="arrowGreen" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#10b981" />
    </marker>
    <marker id="arrowAmber" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#f59e0b" />
    </marker>
    <marker id="arrowRed" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#ef4444" />
    </marker>
  </defs>

  <!-- Title -->
  <text x="475" y="42" text-anchor="middle" font-size="22" font-weight="700" fill="#f8fafc">Sandbox State Machine Transitions</text>
  <text x="475" y="66" text-anchor="middle" font-size="13" fill="#94a3b8">Formal cloud VM operational states and trigger conditions</text>

  <!-- State: UNINITIALIZED -->
  <g filter="url(#shadow)">
    <rect x="50" y="120" width="180" height="90" rx="12" fill="#1e293b" stroke="#64748b" stroke-width="2" />
    <text x="140" y="152" text-anchor="middle" font-size="14" font-weight="700" fill="#f1f5f9">UNINITIALIZED</text>
    <text x="140" y="172" text-anchor="middle" font-size="11" fill="#94a3b8">Session ID created</text>
    <text x="140" y="190" text-anchor="middle" font-size="10" font-weight="600" fill="#38bdf8">Cost: $0.00 / hr</text>
  </g>

  <!-- Arrow to PROVISIONING -->
  <line x1="230" y1="165" x2="310" y2="165" stroke="#3b82f6" stroke-width="2" marker-end="url(#arrowBlue)" />
  <text x="270" y="155" text-anchor="middle" font-size="10" fill="#93c5fd">First prompt</text>

  <!-- State: PROVISIONING -->
  <g filter="url(#shadow)">
    <rect x="310" y="120" width="180" height="90" rx="12" fill="#1e293b" stroke="#3b82f6" stroke-width="2" />
    <text x="400" y="152" text-anchor="middle" font-size="14" font-weight="700" fill="#93c5fd">PROVISIONING</text>
    <text x="400" y="172" text-anchor="middle" font-size="11" fill="#cbd5e1">Launch Firecracker VM</text>
    <text x="400" y="190" text-anchor="middle" font-size="10" fill="#38bdf8">Duration: &lt;150ms</text>
  </g>

  <!-- Arrow to ACTIVE -->
  <line x1="490" y1="165" x2="570" y2="165" stroke="#10b981" stroke-width="2" marker-end="url(#arrowGreen)" />
  <text x="530" y="155" text-anchor="middle" font-size="10" fill="#6ee7b7">VM Ready</text>

  <!-- State: ACTIVE / RUNNING -->
  <g filter="url(#shadow)">
    <rect x="570" y="105" width="220" height="120" rx="14" fill="#064e3b" stroke="#10b981" stroke-width="2.5" />
    <circle cx="595" cy="135" r="6" fill="#34d399" />
    <text x="610" y="140" font-size="15" font-weight="700" fill="#ffffff">ACTIVE / RUNNING</text>
    <text x="590" y="165" font-size="11" fill="#a7f3d0">Executing commands &amp; tools</text>
    <text x="590" y="185" font-size="11" fill="#6ee7b7">Streaming stdout/stderr</text>
    <text x="590" y="205" font-size="11" font-weight="700" fill="#fde68a">Billed: ~$0.1656 / hour</text>
  </g>

  <!-- Self loop: Keep alive on command execution -->
  <path d="M 680 105 C 680 60, 750 60, 750 105" fill="none" stroke="#10b981" stroke-width="2" marker-end="url(#arrowGreen)" />
  <text x="715" y="70" text-anchor="middle" font-size="10" fill="#6ee7b7">Activity resets idle timer</text>

  <!-- Arrow down from ACTIVE to PAUSED -->
  <path d="M 680 225 L 680 340" fill="none" stroke="#f59e0b" stroke-width="2" marker-end="url(#arrowAmber)" />
  <text x="690" y="285" font-size="11" font-weight="600" fill="#fbbf24">15 Min Idle (Timeout)</text>

  <!-- State: PAUSED (HIBERNATING) -->
  <g filter="url(#shadow)">
    <rect x="570" y="340" width="220" height="120" rx="14" fill="#1e293b" stroke="#f59e0b" stroke-width="2" />
    <text x="680" y="375" text-anchor="middle" font-size="15" font-weight="700" fill="#fde68a">PAUSED / SNAPSHOT</text>
    <text x="680" y="398" text-anchor="middle" font-size="11" fill="#cbd5e1">Memory &amp; disk snapshotted</text>
    <text x="680" y="418" text-anchor="middle" font-size="11" fill="#94a3b8">Preserved indefinitely</text>
    <text x="680" y="438" text-anchor="middle" font-size="12" font-weight="700" fill="#34d399">Compute Cost: $0.00 / hr</text>
  </g>

  <!-- Arrow from PAUSED back up to ACTIVE (Auto-Resume) -->
  <path d="M 610 340 L 610 225" fill="none" stroke="#10b981" stroke-width="2" stroke-dasharray="6,4" marker-end="url(#arrowGreen)" />
  <text x="540" y="285" font-size="11" font-weight="600" fill="#34d399">User returns (Resume)</text>

  <!-- State: TERMINATED / DESTROYED -->
  <g filter="url(#shadow)">
    <rect x="180" y="355" width="220" height="90" rx="12" fill="#1e293b" stroke="#ef4444" stroke-width="2" />
    <text x="290" y="388" text-anchor="middle" font-size="14" font-weight="700" fill="#fca5a5">TERMINATED</text>
    <text x="290" y="408" text-anchor="middle" font-size="11" fill="#cbd5e1">Resources reclaimed</text>
    <text x="290" y="426" text-anchor="middle" font-size="10" fill="#94a3b8">sandbox.kill() completed</text>
  </g>

  <!-- Arrow from PAUSED to TERMINATED (LRU Quota eviction or Session Delete) -->
  <line x1="570" y1="400" x2="400" y2="400" stroke="#ef4444" stroke-width="2" marker-end="url(#arrowRed)" />
  <text x="485" y="392" text-anchor="middle" font-size="10" fill="#f87171">LRU Quota Eviction</text>

  <!-- Arrow from ACTIVE to TERMINATED (Explicit session delete) -->
  <path d="M 570 190 L 300 190 L 300 355" fill="none" stroke="#ef4444" stroke-width="1.5" stroke-dasharray="4,4" marker-end="url(#arrowRed)" />
  <text x="310" y="270" font-size="10" fill="#fca5a5">User deletes session</text>
</svg>
