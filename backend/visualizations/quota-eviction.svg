<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 460" width="100%" height="100%" style="background:#0b0f19; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;">
  <defs>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="6" stdDeviation="5" flood-color="#000" flood-opacity="0.5" />
    </filter>
    <marker id="arrowRed" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#ef4444" />
    </marker>
    <marker id="arrowGreen" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#10b981" />
    </marker>
    <marker id="arrowAmber" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#f59e0b" />
    </marker>
  </defs>

  <!-- Title -->
  <text x="460" y="40" text-anchor="middle" font-size="22" font-weight="700" fill="#f8fafc">Per-User Sandbox Quota &amp; Explicit Deletion</text>
  <text x="460" y="64" text-anchor="middle" font-size="13" fill="#94a3b8">MAX_SANDBOXES_PER_USER = 3 | No Auto-Killing — User explicitly chooses which sandbox to delete</text>

  <!-- Container Box representing User's Allocated Slots -->
  <rect x="50" y="100" width="530" height="320" rx="14" fill="#0f172a" stroke="#334155" stroke-width="2" />
  <div style="display:flex; justify-content:space-between">
    <text x="75" y="132" font-size="14" font-weight="700" fill="#cbd5e1">Active Sandboxes: 3 / 3 (Capacity Full)</text>
  </div>

  <!-- Slot 1: Session A -->
  <g filter="url(#shadow)">
    <rect x="75" y="150" width="480" height="70" rx="10" fill="#1e293b" stroke="#10b981" stroke-width="1.5" />
    <circle cx="105" cy="185" r="7" fill="#34d399" />
    <text x="125" y="177" font-size="13" font-weight="700" fill="#ffffff">Session A: Frontend Architecture</text>
    <text x="125" y="197" font-size="11" fill="#94a3b8">Status: Active | Preserved</text>
    <rect x="440" y="167" width="95" height="34" rx="6" fill="#064e3b" />
    <text x="487" y="188" text-anchor="middle" font-size="11" font-weight="700" fill="#6ee7b7">IN USE</text>
  </g>

  <!-- Slot 2: Session B -->
  <g filter="url(#shadow)">
    <rect x="75" y="235" width="480" height="70" rx="10" fill="#1e293b" stroke="#3b82f6" stroke-width="1.5" />
    <circle cx="105" cy="270" r="7" fill="#60a5fa" />
    <text x="125" y="262" font-size="13" font-weight="700" fill="#ffffff">Session B: Fastify MicroVM Service</text>
    <text x="125" y="282" font-size="11" fill="#94a3b8">Status: Paused (Free) | Preserved</text>
    <rect x="440" y="252" width="95" height="34" rx="6" fill="#1e3a8a" />
    <text x="487" y="273" text-anchor="middle" font-size="11" font-weight="700" fill="#93c5fd">STANDBY</text>
  </g>

  <!-- Slot 3: Session C -->
  <g filter="url(#shadow)">
    <rect x="75" y="320" width="480" height="70" rx="10" fill="#1e293b" stroke="#64748b" stroke-width="1.5" />
    <circle cx="105" cy="355" r="7" fill="#94a3b8" />
    <text x="125" y="347" font-size="13" font-weight="700" fill="#ffffff">Session C: Completed Experiment</text>
    <text x="125" y="367" font-size="11" fill="#94a3b8">Status: Paused (Free) | User can delete via Inspector</text>
    <rect x="440" y="337" width="95" height="34" rx="6" fill="#334155" />
    <text x="487" y="358" text-anchor="middle" font-size="11" font-weight="700" fill="#cbd5e1">STANDBY</text>
  </g>

  <!-- Incoming Action on Right Side: Blocked -->
  <g filter="url(#shadow)">
    <rect x="630" y="140" width="250" height="130" rx="12" fill="#2d1515" stroke="#ef4444" stroke-width="2" />
    <text x="755" y="168" text-anchor="middle" font-size="13" font-weight="700" fill="#fca5a5">Session D Launch Request</text>
    <text x="755" y="190" text-anchor="middle" font-size="11" fill="#fecaca">Quota Reached (3/3 Full)</text>
    <text x="755" y="210" text-anchor="middle" font-size="11" font-weight="600" fill="#f87171">🚫 No Auto-Kill Performed</text>
    <text x="755" y="232" text-anchor="middle" font-size="10" fill="#fca5a5">User prompted to delete a sandbox</text>
    <text x="755" y="250" text-anchor="middle" font-size="10" fill="#fca5a5">via Cloud Inspector or Delete Chat</text>
  </g>

  <!-- Arrow pointing down to resolution -->
  <path d="M 755 270 L 755 310" fill="none" stroke="#f59e0b" stroke-width="2" marker-end="url(#arrowAmber)" />

  <!-- Action: User deletes sandbox -->
  <g filter="url(#shadow)">
    <rect x="630" y="315" width="250" height="95" rx="12" fill="#064e3b" stroke="#10b981" stroke-width="2" />
    <text x="755" y="342" text-anchor="middle" font-size="13" font-weight="700" fill="#ffffff">User Controls Deletion</text>
    <text x="755" y="362" text-anchor="middle" font-size="11" fill="#a7f3d0">User clicks "Delete Sandbox"</text>
    <text x="755" y="380" text-anchor="middle" font-size="11" fill="#6ee7b7">Capacity drops to 2/3</text>
    <text x="755" y="398" text-anchor="middle" font-size="10" font-weight="700" fill="#34d399">Session D VM can now be launched!</text>
  </g>
</svg>
